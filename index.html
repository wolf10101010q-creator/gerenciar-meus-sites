<!DOCTYPE html>
<html lang="pt-BR">

<head>

	<meta charset="UTF-8">

	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Meus Aplicativos</title>


	<style>

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			font-family: system-ui;
			transition: background-color .3s, color .3s;
		}


		:root {
			--icone: 54px;
			--raio: 14px;
			--barra: 56px;
		}


		/* ==============================
		   TEMAS
		============================== */

		.tema-escuro {
			--bg1: #1a1a2e;
			--bg2: #16213e;
			--bg3: #0f3460;
			--card: #1e1e2f;
			--input: #2a2a4a;
			--texto: #fff;
			--texto2: #aaa;
			--destaque: #4ade80;
			--borda: rgba(255,255,255,.1);
		}


		.tema-claro {
			--bg1: #f8fafc;
			--bg2: #e2e8f0;
			--bg3: #cbd5e1;
			--card: #fff;
			--input: #f1f5f9;
			--texto: #1e293b;
			--texto2: #64748b;
			--destaque: #16a34a;
			--borda: rgba(0,0,0,.1);
		}


		.tema-azul {
			--bg1: #0c4a6e;
			--bg2: #0369a1;
			--bg3: #0284c7;
			--card: #075985;
			--input: #0369a1;
			--texto: #fff;
			--texto2: #bae6fd;
			--destaque: #7dd3fc;
			--borda: rgba(255,255,255,.15);
		}


		.tema-verde {
			--bg1: #14532d;
			--bg2: #166534;
			--bg3: #15803d;
			--card: #166534;
			--input: #14532d;
			--texto: #fff;
			--texto2: #bbf7d0;
			--destaque: #86efac;
			--borda: rgba(255,255,255,.15);
		}


		/* ==============================
		   BODY
		============================== */

		body {
			background: linear-gradient(
				135deg,
				var(--bg1) 0%,
				var(--bg2) 50%,
				var(--bg3) 100%
			);

			min-height: 100vh;
			color: var(--texto);
			padding: 15px;
			padding-bottom: 90px;
		}


		/* ==============================
		   TELAS
		============================== */

		.tela {
			position: absolute;
			inset: 0;
			display: none;
			flex-direction: column;
		}


		.tela.ativa {
			display: flex;
		}


		.tela--fixa {
			position: fixed;
			z-index: 10;
		}


		/* ==============================
		   MODAIS
		============================== */

		.fundo-modal {
			position: fixed;
			inset: 0;

			background: rgba(0,0,0,.7);

			backdrop-filter: blur(8px);

			z-index: 100;

			display: none;

			align-items: center;
			justify-content: center;

			padding: 20px;
		}


		.fundo-modal.ativo {
			display: flex;
		}


		.janela {
			background: var(--card);

			padding: 20px;

			border-radius: 20px;

			width: 100%;
			max-width: 420px;

			max-height: 90vh;

			overflow-y: auto;

			border: 1px solid var(--borda);

			box-shadow: 0 10px 40px rgba(0,0,0,.3);
		}


		.janela h2 {
			text-align: center;

			margin-bottom: 20px;

			color: var(--destaque);

			font-size: 1.3rem;
		}


		.janela input,
		.janela textarea,
		.janela button {
			width: 100%;

			padding: 13px;

			margin: 7px 0;

			border: none;

			border-radius: 12px;

			background: var(--input);

			color: var(--texto);

			font-size: 1rem;

			outline: none;

			border: 2px solid transparent;
		}


		.janela button {
			cursor: pointer;
		}


		.janela textarea {
			min-height: 100px;

			resize: vertical;

			font-family: monospace;

			font-size: .9rem;
		}


		.janela input:focus,
		.janela textarea:focus {
			border-color: var(--destaque);
		}


		.janela label {
			display: block;

			margin-top: 15px;
			margin-bottom: 5px;

			color: var(--texto2);

			font-size: .9rem;
		}


		.botoes-modal {
			display: flex;

			gap: 10px;

			margin-top: 20px;
		}


		.botoes-modal button {
			flex: 1;

			font-weight: 600;
		}


		.btn-salvar {
			background: #22c55e !important;
			color: #fff !important;
		}


		.btn-cancelar {
			background: #475569 !important;
			color: #fff !important;
		}


		.btn-perigo {
			background: #dc2626 !important;
			color: #fff !important;
		}


		.btn-perigo:disabled {
			opacity: .5;

			cursor: not-allowed;
		}


		/* ==============================
		   CABEÇALHO
		============================== */

		.cabecalho {
			text-align: center;

			padding: 10px 20px 15px;

			position: relative;
		}


		.cabecalho h1 {
			font-size: 1.5rem;

			background: linear-gradient(
				90deg,
				var(--destaque),
				#22d3ee
			);

			-webkit-background-clip: text;

			-webkit-text-fill-color: transparent;

			margin-bottom: 15px;
		}


		.btn-config {
			position: absolute;

			top: 5px;
			right: 5px;

			background: rgba(255,255,255,.1);

			border: none;

			color: var(--texto);

			padding: 8px 10px;

			border-radius: 10px;

			font-size: 1.1rem;

			cursor: pointer;
		}


		/* ==============================
		   PESQUISA
		============================== */

		.barra-pesquisa {
			width: 100%;

			max-width: 430px;

			margin: 0 auto 25px;

			position: sticky;

			top: 0;

			z-index: 50;
		}


		.barra-pesquisa input {
			width: 100%;

			padding: 13px 18px;

			border: none;

			border-radius: 14px;

			background: rgba(255,255,255,.1);

			color: var(--texto);

			font-size: .95rem;

			outline: none;

			border: 2px solid transparent;
		}


		.barra-pesquisa input:focus {
			border-color: var(--destaque);

			background: rgba(255,255,255,.15);
		}


		.barra-pesquisa input::placeholder {
			color: var(--texto2);
		}


		/* ==============================
		   GRADE DE APLICATIVOS
		============================== */

		.grade {
			display: grid;

			grid-template-columns: repeat(4, 1fr);

			gap: 22px 8px;

			width: 100%;

			max-width: 430px;

			margin: 0 auto;
		}


		.app {
			min-width: 0;

			display: flex;

			flex-direction: column;

			align-items: center;

			gap: 6px;

			cursor: pointer;

			position: relative;
		}


		.app.oculto {
			display: none;
		}


		.app:active {
			transform: scale(.94);
		}


		/* ==============================
		   ÍCONE
		============================== */

		.icone {
			width: var(--icone);

			height: var(--icone);

			border-radius: var(--raio);

			background: linear-gradient(
				145deg,
				var(--input),
				var(--card)
			);

			display: flex;

			align-items: center;

			justify-content: center;

			font-size: 1.5rem;

			overflow: hidden;

			border: 2px solid var(--borda);

			box-shadow: 0 3px 10px rgba(0,0,0,.2);
		}


		.icone img {
			width: 100%;

			height: 100%;

			object-fit: cover;
		}


		.icone-letra {
			font-size: 1.7rem;

			font-weight: bold;

			color: var(--texto);
		}


		.nome-app {
			font-size: .72rem;

			color: var(--texto);

			text-align: center;

			width: 100%;

			max-width: 82px;

			overflow: hidden;

			text-overflow: ellipsis;

			white-space: nowrap;
		}


		/* ==============================
		   BOTÃO ADICIONAR
		============================== */

		.btn-adicionar .icone {
			background: rgba(255,255,255,.05);

			border: 2px dashed var(--borda);

			font-size: 1.5rem;

			color: var(--texto2);
		}


		/* ==============================
		   SELEÇÃO
		============================== */

		.bolinha-selecao {
			position: absolute;

			top: -5px;

			left: 3px;

			width: 20px;

			height: 20px;

			border-radius: 50%;

			border: 2px solid var(--texto2);

			background: transparent;

			display: flex;

			align-items: center;

			justify-content: center;

			z-index: 10;

			opacity: 0;

			pointer-events: none;
		}


		.modo-exclusao .bolinha-selecao {
			opacity: 1;

			pointer-events: auto;
		}


		.bolinha-selecao.selecionada {
			background: #ef4444;

			border-color: #ef4444;
		}


		.bolinha-selecao.selecionada::after {
			content: "✓";

			color: #fff;

			font-size: 12px;

			font-weight: bold;
		}


		/* ==============================
		   BARRA DE EXCLUSÃO
		============================== */

		.barra-acoes-exclusao {
			position: fixed;

			bottom: 0;

			left: 0;

			right: 0;

			height: 70px;

			background: var(--card);

			border-top: 1px solid var(--borda);

			display: none;

			align-items: center;

			justify-content: space-around;

			gap: 10px;

			padding: 0 10px;

			z-index: 80;

			box-shadow: 0 -4px 15px rgba(0,0,0,.2);
		}


		.barra-acoes-exclusao.ativa {
			display: flex;
		}


		/* ==============================
		   TELA DO SITE
		============================== */

		.barra-navegacao {
			height: var(--barra);

			background: var(--card);

			display: flex;

			align-items: center;

			padding: 0 12px;

			border-bottom: 1px solid var(--borda);

			flex-shrink: 0;
		}


		.btn-voltar {
			background: rgba(74,222,128,.15);

			color: var(--destaque);

			border: none;

			padding: 9px 13px;

			border-radius: 10px;

			font-size: .9rem;

			font-weight: 600;

			cursor: pointer;
		}


		.titulo-site {
			flex: 1;

			text-align: center;

			font-size: .95rem;

			color: var(--texto);

			overflow: hidden;

			white-space: nowrap;

			text-overflow: ellipsis;

			padding: 0 10px;
		}


		.conteudo-site {
			flex: 1;

			width: 100%;

			border: none;

			background: #fff;
		}


		/* ==============================
		   ÍCONE DO APP
		============================== */

		.tipo-icone-opcoes {
			display: flex;

			gap: 8px;

			margin: 10px 0;
		}


		.tipo-icone-btn {
			flex: 1;

			padding: 9px;

			border: 2px solid var(--borda);

			background: transparent;

			color: var(--texto2);

			border-radius: 10px;

			cursor: pointer;
		}


		.tipo-icone-btn.ativo {
			border-color: var(--destaque);

			background: rgba(74,222,128,.1);

			color: var(--destaque);
		}


		.campo-icone {
			display: none;
		}


		.campo-icone.visivel {
			display: block;
		}


		/* ==============================
		   TEMAS
		============================== */

		.temas-opcoes {
			display: grid;

			grid-template-columns: 1fr 1fr;

			gap: 8px;

			margin-top: 10px;
		}


		.btn-tema {
			padding: 11px;

			border-radius: 10px;

			border: 2px solid transparent;

			cursor: pointer;

			font-size: .85rem;

			font-weight: 500;
		}


		.btn-tema.ativo {
			border-color: var(--destaque);

			transform: scale(1.03);
		}


		.tema-escuro-btn {
			background: linear-gradient(135deg,#1a1a2e,#16213e);

			color: #fff;
		}


		.tema-claro-btn {
			background: linear-gradient(135deg,#f8fafc,#e2e8f0);

			color: #1e293b;
		}


		.tema-azul-btn {
			background: linear-gradient(135deg,#0c4a6e,#0369a1);

			color: #fff;
		}


		.tema-verde-btn {
			background: linear-gradient(135deg,#14532d,#166534);

			color: #fff;
		}


		/* ==============================
		   EMOJIS
		============================== */

		.emojis-grade {
			display: grid;

			grid-template-columns: repeat(8,1fr);

			gap: 5px;

			margin-top: 10px;
		}


		.emoji-item {
			font-size: 1.4rem;

			text-align: center;

			padding: 6px;

			border-radius: 8px;

			cursor: pointer;
		}


		.emoji-item.selecionado {
			background: rgba(74,222,128,.2);
		}


		/* ==============================
		   MENSAGENS
		============================== */

		.carregando,
		.aviso {
			text-align: center;

			padding: 40px;

			color: var(--texto2);

			grid-column: 1 / -1;

			line-height: 1.6;
		}


		.carregando {
			color: var(--destaque);
		}


		/* ==============================
		   INDICADOR
		============================== */

		.indicador-atualizacao {
			position: fixed;

			top: 10px;

			left: 50%;

			transform: translateX(-50%);

			background: rgba(34,197,94,.2);

			color: #22c55e;

			padding: 6px 16px;

			border-radius: 20px;

			font-size: .8rem;

			z-index: 999;

			opacity: 0;

			pointer-events: none;
		}


		.indicador-atualizacao.mostrar {
			opacity: 1;
		}


		.btn-pequeno {
			padding: 10px 14px;

			font-size: .9rem;

			border-radius: 10px;

			border: none;

			cursor: pointer;

			width: 100%;

			margin: 8px 0;
		}

	</style>

</head>


<body class="tema-escuro" id="corpo-principal">


	<div
		class="indicador-atualizacao"
		id="indicador-atualizacao"
	>
		✅ Atualizado
	</div>


	<!-- ==============================
	     TELA PRINCIPAL
	============================== -->

	<div class="tela ativa" id="tela-inicial">

		<div class="cabecalho">

			<h1>📱 Meus Aplicativos</h1>

			<button
				class="btn-config"
				onclick="abrirJanela('modal-config')"
			>
				⚙️
			</button>

		</div>


		<div class="barra-pesquisa">

			<input
				type="text"
				id="pesquisa"
				placeholder="🔍 Pesquisar aplicativos..."
				oninput="filtrarApps()"
			>

		</div>


		<div
			class="grade"
			id="grade-apps"
		>

			<div class="carregando">
				Carregando aplicativos...
			</div>

		</div>

	</div>


	<!-- ==============================
	     TELA DO SITE
	============================== -->

	<div
		class="tela tela--fixa"
		id="tela-site"
	>

		<div class="barra-navegacao">

			<button
				class="btn-voltar"
				onclick="voltarInicio()"
			>
				⬅️ Voltar
			</button>


			<span
				class="titulo-site"
				id="titulo-site"
			></span>

		</div>


		<iframe
			class="conteudo-site"
			id="conteudo-site"
			srcdoc=""
		></iframe>

	</div>


	<!-- ==============================
	     BARRA DE EXCLUSÃO
	============================== -->

	<div
		class="barra-acoes-exclusao"
		id="barra-exclusao"
	>

		<button
			class="btn-cancelar"
			style="flex:1;padding:12px"
			onclick="sairModoExclusao()"
		>
			❌ Cancelar
		</button>


		<button
			class="btn-perigo"
			id="btn-apagar-selecionados"
			style="flex:1;padding:12px"
			onclick="apagarSelecionados()"
			disabled
		>
			🗑️ Apagar (0)
		</button>

	</div>


	<!-- ==============================
	     MODAL ADICIONAR / EDITAR
	============================== -->

	<div
		class="fundo-modal"
		id="modal-add"
	>

		<div class="janela">

			<h2 id="titulo-add">
				➕ Adicionar Aplicativo
			</h2>


			<input
				type="text"
				id="nome-app"
				placeholder="Nome do aplicativo"
			>


			<label>
				Tipo de Ícone:
			</label>


			<div class="tipo-icone-opcoes">

				<button
					class="tipo-icone-btn ativo"
					data-tipo="emoji"
					onclick="mudarTipoIcone('emoji')"
				>
					😀 Emoji
				</button>


				<button
					class="tipo-icone-btn"
					data-tipo="letra"
					onclick="mudarTipoIcone('letra')"
				>
					Aa Letra
				</button>


				<button
					class="tipo-icone-btn"
					data-tipo="imagem"
					onclick="mudarTipoIcone('imagem')"
				>
					🖼️ Imagem
				</button>

			</div>


			<div
				class="campo-icone visivel"
				id="campo-emoji"
			>

				<label>
					Escolha um emoji:
				</label>


				<div
					class="emojis-grade"
					id="lista-emojis"
				></div>

			</div>


			<div
				class="campo-icone"
				id="campo-letra"
			>

				<input
					type="text"
					id="texto-icone"
					placeholder="Digite uma letra ou símbolo"
					maxlength="2"
				>

			</div>


			<div
				class="campo-icone"
				id="campo-imagem"
			>

				<input
					type="text"
					id="img-app"
					placeholder="URL da imagem"
				>

			</div>


			<label>
				Código do site / Conteúdo:
			</label>


			<textarea
				id="codigo-app"
				placeholder="📋 Cole o código HTML ou conteúdo aqui..."
			></textarea>


			<div class="botoes-modal">

				<button
					class="btn-cancelar"
					onclick="fecharJanela('modal-add')"
				>
					❌ Cancelar
				</button>


				<button
					class="btn-salvar"
					onclick="salvarApp()"
				>
					✅ Salvar
				</button>

			</div>

		</div>

	</div>


	<!-- ==============================
	     MODAL CONFIGURAÇÕES
	============================== -->

	<div
		class="fundo-modal"
		id="modal-config"
	>

		<div class="janela">

			<h2>
				⚙️ Configurações
			</h2>


			<label>
				🎨 Tema de fundo:
			</label>


			<div class="temas-opcoes">

				<button
					class="btn-tema tema-escuro-btn ativo"
					data-tema="escuro"
					onclick="mudarTema('escuro')"
				>
					🌙 Escuro
				</button>


				<button
					class="btn-tema tema-claro-btn"
					data-tema="claro"
					onclick="mudarTema('claro')"
				>
					☀️ Claro
				</button>


				<button
					class="btn-tema tema-azul-btn"
					data-tema="azul"
					onclick="mudarTema('azul')"
				>
					🌊 Azul
				</button>


				<button
					class="btn-tema tema-verde-btn"
					data-tema="verde"
					onclick="mudarTema('verde')"
				>
					🌿 Verde
				</button>

			</div>


			<div
				style="
					height:1px;
					background:var(--borda);
					margin:20px 0;
				"
			></div>


			<label>
				🗑️ Gerenciar aplicativos:
			</label>


			<button
				class="btn-perigo btn-pequeno"
				onclick="iniciarModoExclusao();fecharJanela('modal-config')"
			>
				🗑️ Excluir itens...
			</button>


			<p
				style="
					font-size:.8rem;
					color:var(--texto2);
					margin-top:8px;
					line-height:1.5;
				"
			>
				Clique para selecionar os aplicativos que deseja remover.
			</p>


			<div
				style="
					height:1px;
					background:var(--borda);
					margin:20px 0;
				"
			></div>


			<p
				style="
					font-size:.85rem;
					color:var(--texto2);
					text-align:center;
					line-height:1.6;
				"
			>
				✅ Dados salvos na nuvem automaticamente.<br>
				🔒 Configurações de acesso protegidas.
			</p>


			<div class="botoes-modal">

				<button
					class="btn-cancelar"
					onclick="fecharJanela('modal-config')"
				>
					Fechar
				</button>

			</div>

		</div>

	</div>


	<script>

		/* ==============================
		   CONFIGURAÇÕES
		============================== */

		const $ = id => document.getElementById(id);


		const JSONBIN_ID = "6a8668b9da38895dfef9a730";


		const JSONBIN_KEY = "$2a$10$7CAI7MjsFfgYYFzpjv/2g.wS1.EqV/gP4o8/Ic7Kl8PejTQtGIRRC";


		const JSONBIN_URL = "https://api.jsonbin.io/v3/b/";


		const EMOJIS = [
			"📱","💬","🌐","🎮",
			"📚","🎵","📷","⚙️",
			"🏠","📂","🔍","⭐",
			"❤️","🔥","💡","📝",
			"🎨","📊","📈","💻",
			"🔔","📧","📅","🎯",
			"🛒","🎁","📰","🌙",
			"☀️","⚡","🔒","🔑"
		];


		const estado = {

			apps: [],

			editando: null,

			temaAtual: "escuro",

			tipoIcone: "emoji",

			emojiEscolhido: "📌",

			modoExclusao: false,

			selecionados: new Set()

		};


		/* ==============================
		   FUNÇÕES DE INTERFACE
		============================== */

		function abrirTela(id) {

			document
				.querySelectorAll(".tela")
				.forEach(tela => tela.classList.remove("ativa"));

			$(id).classList.add("ativa");

		}


		function fecharTela(id) {

			$(id).classList.remove("ativa");

		}


		function voltarInicio() {

			$("conteudo-site").srcdoc = "";

			fecharTela("tela-site");

			abrirTela("tela-inicial");

		}


		function abrirJanela(id) {

			$(id).classList.add("ativo");

		}


		function fecharJanela(id) {

			$(id).classList.remove("ativo");

			estado.editando = null;

		}


		function mostrarAtualizado() {

			const indicador = $("indicador-atualizacao");

			indicador.classList.add("mostrar");

			setTimeout(() => {

				indicador.classList.remove("mostrar");

			}, 1500);

		}


		/* ==============================
		   TEMAS
		============================== */

		function mudarTema(tema) {

			document.body.classList.remove(
				"tema-escuro",
				"tema-claro",
				"tema-azul",
				"tema-verde"
			);


			document.body.classList.add(`tema-${tema}`);


			estado.temaAtual = tema;


			document
				.querySelectorAll(".btn-tema")
				.forEach(botao => botao.classList.remove("ativo"));


			const botao = document.querySelector(
				`[data-tema="${tema}"]`
			);


			if (botao) {
				botao.classList.add("ativo");
			}


			localStorage.setItem(
				"temaAplicativo",
				tema
			);

		}


		function carregarTema() {

			const tema = localStorage.getItem(
				"temaAplicativo"
			);


			if (tema) {
				mudarTema(tema);
			}

		}


		/* ==============================
		   EMOJIS
		============================== */

		function renderizarEmojis() {

			const grade = $("lista-emojis");

			grade.innerHTML = "";


			EMOJIS.forEach(emoji => {

				const item = document.createElement("div");

				item.className = "emoji-item";


				if (emoji === estado.emojiEscolhido) {
					item.classList.add("selecionado");
				}


				item.textContent = emoji;


				item.onclick = () => {

					estado.emojiEscolhido = emoji;

					renderizarEmojis();

				};


				grade.appendChild(item);

			});

		}


		/* ==============================
		   TIPO DE ÍCONE
		============================== */

		function mudarTipoIcone(tipo) {

			estado.tipoIcone = tipo;


			document
				.querySelectorAll(".tipo-icone-btn")
				.forEach(botao => {

					botao.classList.toggle(
						"ativo",
						botao.dataset.tipo === tipo
					);

				});


			document
				.querySelectorAll(".campo-icone")
				.forEach(campo => {

					campo.classList.remove("visivel");

				});


			$(`campo-${tipo}`)
				.classList.add("visivel");

		}


		/* ==============================
		   FORMULÁRIO
		============================== */

		function limparFormulario() {

			$("nome-app").value = "";

			$("codigo-app").value = "";

			$("img-app").value = "";

			$("texto-icone").value = "";


			estado.editando = null;

			estado.tipoIcone = "emoji";

			estado.emojiEscolhido = "📌";


			mudarTipoIcone("emoji");

			renderizarEmojis();

		}


		function preencherFormulario(app) {

			$("nome-app").value = app.nome || "";

			$("codigo-app").value = app.codigo || "";

			$("img-app").value =
				app.iconeTipo === "imagem"
					? app.iconeValor
					: "";


			$("texto-icone").value =
				app.iconeTipo === "letra"
					? app.iconeValor
					: "";


			estado.tipoIcone =
				app.iconeTipo || "emoji";


			estado.emojiEscolhido =
				app.iconeValor || "📌";


			mudarTipoIcone(
				estado.tipoIcone
			);


			renderizarEmojis();

		}


		/* ==============================
		   PESQUISA
		============================== */

		function filtrarApps() {

			const termo = $("pesquisa")
				.value
				.trim()
				.toLowerCase();


			document
				.querySelectorAll(".app")
				.forEach(app => {

					const nome =
						app
							.querySelector(".nome-app")
							.textContent
							.toLowerCase();


					app.classList.toggle(
						"oculto",
						termo &&
						!nome.includes(termo)
					);

				});

		}


		/* ==============================
		   ÍCONE DO APLICATIVO
		============================== */

		function criarIcone(app) {

			if (app.iconeTipo === "imagem") {

				const imagem =
					document.createElement("img");


				imagem.src =
					app.iconeValor || "";


				imagem.alt = "";


				imagem.onerror = () => {

					imagem.style.display = "none";

				};


				return imagem;

			}


			const texto =
				document.createElement("span");


			if (app.iconeTipo === "letra") {

				texto.className = "icone-letra";

			}


			texto.textContent =
				app.iconeValor || "📌";


			return texto;

		}


		/* ==============================
		   RENDERIZAR APLICATIVOS
		============================== */

		function renderizar() {

			const grade = $("grade-apps");

			grade.innerHTML = "";


			if (estado.apps.length === 0) {

				grade.innerHTML = `
					<div class="aviso">
						Nenhum aplicativo ainda.<br>
						Clique em ➕ para adicionar o primeiro!
					</div>
				`;

				return;

			}


			estado.apps.forEach((app, index) => {

				const elemento =
					document.createElement("div");


				elemento.className = "app";


				const icone =
					document.createElement("div");


				icone.className = "icone";


				icone.appendChild(
					criarIcone(app)
				);


				const nome =
					document.createElement("div");


				nome.className = "nome-app";

				nome.textContent =
					app.nome;


				elemento.appendChild(
					icone
				);


				elemento.appendChild(
					nome
				);


				if (estado.modoExclusao) {

					const bolinha =
						document.createElement("div");


					bolinha.className =
						"bolinha-selecao";


					if (
						estado.selecionados.has(index)
					) {

						bolinha.classList.add(
							"selecionada"
						);

					}


					bolinha.onclick =
						event => {

							toggleSelecao(
								index,
								event
							);

						};


					elemento.prepend(
						bolinha
					);


					elemento.onclick =
						event => {

							toggleSelecao(
								index,
								event
							);

						};

				} else {

					elemento.onclick =
						() => abrirApp(index);


					elemento.ondblclick =
						() => editarApp(index);

				}


				grade.appendChild(
					elemento
				);

			});


			if (!estado.modoExclusao) {

				const adicionar =
					document.createElement("div");


				adicionar.className =
					"app btn-adicionar";


				adicionar.innerHTML = `
					<div class="icone">+</div>
					<div class="nome-app">Adicionar</div>
				`;


				adicionar.onclick =
					abrirFormularioNovo;


				grade.appendChild(
					adicionar
				);

			}


			filtrarApps();

		}


		/* ==============================
		   NOVO APLICATIVO
		============================== */

		function abrirFormularioNovo() {

			limparFormulario();


			$("titulo-add").textContent =
				"➕ Adicionar Aplicativo";


			abrirJanela(
				"modal-add"
			);

		}


		/* ==============================
		   ABRIR APLICATIVO
		============================== */

		function abrirApp(index) {

			const app =
				estado.apps[index];


			if (!app.codigo) {

				alert(
					"⚠️ Este aplicativo não possui conteúdo."
				);

				return;

			}


			$("titulo-site").textContent =
				app.nome;


			$("conteudo-site").srcdoc =
				app.codigo;


			abrirTela(
				"tela-site"
			);

		}


		/* ==============================
		   EDITAR APLICATIVO
		============================== */

		function editarApp(index) {

			const app =
				estado.apps[index];


			estado.editando =
				index;


			$("titulo-add").textContent =
				"✏️ Editar Aplicativo";


			preencherFormulario(
				app
			);


			abrirJanela(
				"modal-add"
			);

		}


		/* ==============================
		   SALVAR APLICATIVO
		============================== */

		async function salvarApp() {

			const nome =
				$("nome-app")
					.value
					.trim();


			const codigo =
				$("codigo-app")
					.value
					.trim();


			if (!nome) {

				alert(
					"⚠️ Digite o nome do aplicativo!"
				);

				return;

			}


			let iconeValor = "";


			if (
				estado.tipoIcone === "emoji"
			) {

				iconeValor =
					estado.emojiEscolhido;

			}


			if (
				estado.tipoIcone === "letra"
			) {

				iconeValor =
					$("texto-icone")
						.value
						.trim() || "A";

			}


			if (
				estado.tipoIcone === "imagem"
			) {

				iconeValor =
					$("img-app")
						.value
						.trim();

			}


			const app = {

				nome,

				codigo,

				iconeTipo:
					estado.tipoIcone,

				iconeValor

			};


			if (
				estado.editando !== null
			) {

				estado.apps[
					estado.editando
				] = app;

			} else {

				estado.apps.push(
					app
				);

			}


			const sucesso =
				await salvarBanco();


			if (!sucesso) {
				return;
			}


			fecharJanela(
				"modal-add"
			);


			renderizar();


			alert(
				"✅ Salvo com sucesso!"
			);

		}


		/* ==============================
		   JSONBIN
		============================== */

		async function salvarBanco() {

			try {

				const resposta =
					await fetch(
						JSONBIN_URL + JSONBIN_ID,
						{
							method: "PUT",

							headers: {
								"Content-Type":
									"application/json",

								"X-Master-Key":
									JSONBIN_KEY
							},

							body:
								JSON.stringify({
									aplicativos:
										estado.apps
								})

						}
					);


				if (!resposta.ok) {

					throw new Error(
						"Erro ao salvar"
					);

				}


				mostrarAtualizado();

				return true;

			} catch (erro) {

				console.error(
					"Erro ao salvar:",
					erro
				);


				alert(
					"⚠️ Erro ao salvar! Verifique sua conexão."
				);


				return false;

			}

		}


		async function carregarApps() {

			try {

				const resposta =
					await fetch(
						JSONBIN_URL + JSONBIN_ID,
						{
							method: "GET",

							headers: {
								"X-Master-Key":
									JSONBIN_KEY
							}
						}
					);


				if (!resposta.ok) {

					throw new Error(
						"Erro ao carregar"
					);

				}


				const dados =
					await resposta.json();


				estado.apps =
					dados.record?.aplicativos ||
					dados.record ||
					[];


				renderizar();

				mostrarAtualizado();

			} catch (erro) {

				console.error(
					"Erro ao carregar:",
					erro
				);


				$("grade-apps").innerHTML = `
					<div class="aviso">
						⚠️ Não foi possível carregar os dados.<br>
						Verifique sua conexão e tente novamente.
					</div>
				`;

			}

		}


		/* ==============================
		   MODO EXCLUSÃO
		============================== */

		function iniciarModoExclusao() {

			estado.modoExclusao = true;

			estado.selecionados.clear();


			$("corpo-principal")
				.classList.add(
					"modo-exclusao"
				);


			$("barra-exclusao")
				.classList.add(
					"ativa"
				);


			atualizarBotaoApagar();

			renderizar();

		}


		function sairModoExclusao() {

			estado.modoExclusao = false;

			estado.selecionados.clear();


			$("corpo-principal")
				.classList.remove(
					"modo-exclusao"
				);


			$("barra-exclusao")
				.classList.remove(
					"ativa"
				);


			renderizar();

		}


		function toggleSelecao(index, event) {

			event.stopPropagation();


			if (
				estado.selecionados.has(index)
			) {

				estado.selecionados.delete(
					index
				);

			} else {

				estado.selecionados.add(
					index
				);

			}


			atualizarBotaoApagar();

			renderizar();

		}


		function atualizarBotaoApagar() {

			const quantidade =
				estado.selecionados.size;


			const botao =
				$("btn-apagar-selecionados");


			botao.textContent =
				`🗑️ Apagar (${quantidade})`;


			botao.disabled =
				quantidade === 0;

		}


		async function apagarSelecionados() {

			const quantidade =
				estado.selecionados.size;


			if (!quantidade) {

				alert(
					"Selecione pelo menos um aplicativo!"
				);

				return;

			}


			const confirmar =
				confirm(
					`⚠️ Tem certeza que deseja apagar ${quantidade} aplicativo(s)?\n\nEsta ação não pode ser desfeita!`
				);


			if (!confirmar) {
				return;
			}


			const indices =
				Array.from(
					estado.selecionados
				)
				.sort(
					(a,b) => b - a
				);


			indices.forEach(index => {

				estado.apps.splice(
					index,
					1
				);

			});


			const sucesso =
				await salvarBanco();


			if (!sucesso) {
				return;
			}


			alert(
				`✅ ${quantidade} aplicativo(s) removido(s)!`
			);


			sairModoExclusao();

		}


		/* ==============================
		   INICIALIZAÇÃO
		============================== */

		document.addEventListener(
			"DOMContentLoaded",
			() => {

				carregarTema();

				renderizarEmojis();

				carregarApps();


				setInterval(
					carregarApps,
					30000
				);


				$("modal-add").addEventListener(
					"click",
					event => {

						if (
							event.target ===
							$("modal-add")
						) {

							fecharJanela(
								"modal-add"
							);

						}

					}
				);


				$("modal-config").addEventListener(
					"click",
					event => {

						if (
							event.target ===
							$("modal-config")
						) {

							fecharJanela(
								"modal-config"
							);

						}

					}
				);

			}
		);

	</script>

</body>

</html>
